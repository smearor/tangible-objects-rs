name: Check Changelog

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    branches: [ main ]

jobs:
  check_changelog:
    name: Check Changelog
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: tarides/changelog-check-action@v4
        with:
          changelog: CHANGELOG.md
