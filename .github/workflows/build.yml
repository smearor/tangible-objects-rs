name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APT_PACKAGES: curl build-essential pkg-config libgtk-4-dev libglib2.0-dev libadwaita-1-dev libgtk4-layer-shell-dev

jobs:
  formatting:
    name: Verify code formatting
    runs-on: ubuntu-26.04
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-01
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
  lint:
    name: Lint
    needs: [ formatting ]
    strategy:
      matrix:
        os: [ ubuntu-26.04, ubuntu-26.04-arm ]
        toolchain: [ stable, nightly-2026-06-01 ]
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
          components: clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
  build_linux:
    name: Release Build (Linux)
    needs: [ lint ]
    strategy:
      matrix:
        os: [ ubuntu-26.04, ubuntu-26.04-arm ]
        toolchain: [ stable, nightly-2026-06-01 ]
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build (Release Mode)
        run: cargo build --workspace --release --all-features --verbose
  test:
    name: Tests
    needs: [ lint ]
    strategy:
      matrix:
        os: [ ubuntu-26.04, ubuntu-26.04-arm ]
        toolchain: [ stable, nightly-2026-06-01 ]
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Test (Release Mode)
        run: cargo test --workspace --release --all-features --verbose --target ${{ matrix.target }}
