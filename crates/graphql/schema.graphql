	"""
	mode: CompletionMode!
	"""
	Incumbent re-match tolerance widening (`match_score <= factor`);
	`1.0` disables. Default 2.0.
	"""
	affinityFactor: AffinityFactor!
	"""
	Per-slot position smoothing alpha; `0.0` disables. Default 0.6.
