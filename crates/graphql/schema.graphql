Definition of a Tangible Object Set (TOS).

A set activates when **all** `mandatory` member patterns are present on
the touch surface and stays active while **at least one** mandatory
member remains (activation hysteresis, see `TANGIBLE_OBJECT_SET.md`).
`additional` members belong to the set but never affect activation.
"""
type TangibleSet {
	"""
	Unique identifier of the set.
	"""
	id: TangibleSetId!
	"""
	Human-readable name of the set.
	"""
	name: String!
	"""
	Patterns that must all be present to activate the set.
	"""
	mandatory: [PatternId!]!
	"""
	Optional member patterns; never affect activation.
	"""
	additional: [PatternId!]!
}

scalar TangibleSetId

"""
A [`TangibleSet`] definition joined with its live activation state.

The `active` flag is runtime state derived by the [`SetTracker`] and not
part of the persisted set definition; this type bundles both for
interface-facing queries. Serializes flat as `{id, name, mandatory,
additional, active}`.
"""
type TangibleSetState {
	"""
	The set definition; serialized inline via `#[serde(flatten)]`.
	"""
	set: TangibleSet!
	"""
	Whether the set is currently active on the surface.
	"""
	active: Boolean!
}

"""
A single active multitouch contact tracked by its slot.

Serializes flat as `{slot, tracking_id, x, y}` via `#[serde(flatten)]` on
the position.
"""
type TouchPoint {
	"""
	Multitouch slot number the contact is assigned to.
	"""
	slot: TouchPointSlot!
	"""
	Kernel-assigned tracking ID of the contact lifetime.
	"""
	trackingId: TrackingId!
	"""
	Contact position (raw device units when uncalibrated).
	"""
	pos: Point!
}

scalar TouchPointSlot

"""
A tangible figure tracked across frames with a smoothed pose.

Produced by the engine's `Tracker`; position and rotation are
exponentially smoothed over consecutive frames. Serializes to the
interface-facing flat shape `{id, pattern_id, pattern_name, center_x,
center_y, rotation_deg}` - millimeters and degrees, without the internal
`frames_since_match` hysteresis counter.
"""
type TrackedTangible {
	"""
	Stable ID of this tangible, assigned by the `Tracker` on creation.
	Distinguishes tangibles matching the same pattern.
	"""
	id: TangibleId!
	"""
	ID of the matched pattern.
	"""
	patternId: PatternId!
	"""
	Name of the matched figure profile.
	"""
	patternName: PatternName!
	"""
	Smoothed centroid position.
	"""
	center: Point!
	"""
	Smoothed orientation in radians.
	"""
	rotationRad: RotationRad!
	"""
	Whether this tangible was spawned by a partial match and has not
	yet confirmed (SPAWN_AS_PARTIAL.md). Pending tangibles reserve
	their slots but emit no events until the spawn-stability window
	or an exact match confirms them.
	"""
	pending: Boolean!
	"""
	Smoothed orientation in degrees.
	"""
	rotationDeg: Float!
}

scalar TrackingId

scalar UnitsPerMm

"""
Window anchor of a [`crate::FieldSet`]: the top-left corner of the
application's window in screen millimeters.

Field coordinates are interpreted window-relative. When `width` and
`height` are present, field bounds are normalized `0.0..=1.0` values
scaled to the window size; otherwise they are plain millimeters
relative to the anchor.
"""
type WindowAnchor {
	"""
	Window's left edge on screen, in millimeters.
	"""
	xOffset: Millimeters!
	"""
	Window's top edge on screen, in millimeters.
	"""
	yOffset: Millimeters!
	"""
	Window width in millimeters - enables normalized field bounds.
	"""
	width: Millimeters
	"""
	Window height in millimeters - enables normalized field bounds.
	"""
	height: Millimeters
}

"""
Window anchor for a field set.
"""
input WindowInput {
	"""
	Window's left edge in screen mm.
	"""
	xOffset: Millimeters!
	"""
	Window's top edge in screen mm.
	"""
	yOffset: Millimeters!
	"""
	Window width for normalized field coordinates.
	"""
	width: Millimeters
	"""
	Window height for normalized field coordinates.
	"""
	height: Millimeters
}

"""
Marks an element of a GraphQL schema as no longer supported.
"""
directive @deprecated(reason: String = "No longer supported") on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE
"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
	subscription: SubscriptionRoot
}

