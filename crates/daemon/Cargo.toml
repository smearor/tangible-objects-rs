[package]
name = "tangible-objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Daemon for tangible object detection on multitouch surfaces."

[features]
gui = ["dep:gtk4", "dep:cairo-rs"]

[dependencies]
clap.workspace = true
libc.workspace = true
miette.workspace = true
serde_json.workspace = true
tangible-objects-analysis.workspace = true
tangible-objects-dbus.workspace = true
tangible-objects-engine.workspace = true
tangible-objects-graphql.workspace = true
tangible-objects-mcp.workspace = true
tangible-objects-model.workspace = true
tangible-objects-runtime.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cairo-rs = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }

[[bin]]
name = "tangible-objects"
path = "src/main.rs"
