[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/tangible-objects-rs"
homepage = "https://github.com/smearor/tangible-objects-rs"

[workspace.dependencies]
# workspace crates
tangible-objects-model = { path = "crates/model" }
tangible-objects-engine = { path = "crates/engine" }
tangible-objects-analysis = { path = "crates/analysis" }
tangible-objects-runtime = { path = "crates/runtime" }
tangible-objects-graphql = { path = "crates/graphql" }
tangible-objects-dbus = { path = "crates/dbus" }
tangible-objects-mcp = { path = "crates/mcp" }
# core
serde = { version = "1.0", features = ["derive"] }
serde-jsonlines = "0.7"
toml = "0.8"
thiserror = "2.0"
miette = "7.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# engine
evdev = "0.12"
libc = "0.2"
futures-lite = "2"
tokio = { version = "1", features = ["full"] }
# interfaces (planned for Phase 2)
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
serde_json = "1"
# clients
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
gtk4 = "0.11"
gio = "0.22"
glib = "0.22"
cairo-rs = "0.22"
