[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/tangible-objects-rs"
homepage = "https://github.com/smearor/tangible-objects-rs"

[workspace.dependencies]
# workspace crates
tangible-objects-model = { path = "crates/model" }
tangible-objects-engine = { path = "crates/engine" }
# core
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
miette = "7.6"
tracing = "0.1"
# engine
evdev = "0.12"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
# interfaces (planned for Phase 2)
async-graphql = "7"
axum = "0.7"
zbus = "5"
rmcp = "0.*"
# clients
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
gtk4 = "0.11"
gio = "0.22"
glib = "0.22"
cairo-rs = "0.22"
